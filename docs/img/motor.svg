<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6ee7b7"/>
    </marker>
    <marker id="setaA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="18" fill="url(#bg)"/>

  <text x="40" y="52" fill="#f5f3ff" font-size="22" font-weight="800">Como o motor decide</text>
  <text x="40" y="78" fill="#a3a9c2" font-size="14">estágios em ordem · cada estágio escolhe o primeiro grupo de fluxos que está inteiro de pé · se um estágio falha, os seguintes nem são avaliados</text>

  <!-- ===== estágio 1 ===== -->
  <g transform="translate(40,110)">
    <rect width="340" height="300" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#334155"/>
    <text x="20" y="34" fill="#e0b25c" font-size="12" font-weight="700" letter-spacing="2">ESTÁGIO 1</text>
    <text x="20" y="60" fill="#f5f3ff" font-size="19" font-weight="700">Registro do VDA</text>
    <rect x="20" y="74" width="132" height="24" rx="12" fill="#f472b6" fill-opacity="0.15"/>
    <text x="86" y="91" fill="#f9a8d4" font-size="12" font-weight="700" text-anchor="middle">exige: todos (E)</text>

    <rect x="20" y="114" width="300" height="160" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect x="36" y="132" width="268" height="32" rx="7" fill="#0b1220"/>
      <text x="50" y="153" fill="#d1fae5">reg-cloud</text><text x="290" y="153" fill="#64748b" text-anchor="end">TCP 443</text>
      <rect x="36" y="172" width="268" height="32" rx="7" fill="#0b1220"/>
      <text x="50" y="193" fill="#d1fae5">reg-cc</text><text x="290" y="193" fill="#64748b" text-anchor="end">TCP 443</text>
      <rect x="36" y="212" width="268" height="32" rx="7" fill="#0b1220"/>
      <text x="50" y="233" fill="#d1fae5">ctl-gw</text><text x="290" y="233" fill="#64748b" text-anchor="end">TCP 443</text>
    </g>
    <text x="170" y="266" fill="#94a3b8" font-size="12" text-anchor="middle">um só fora → estágio falha</text>
  </g>

  <path d="M386 260 H 414" stroke="#6ee7b7" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- ===== estágio 2 ===== -->
  <g transform="translate(420,110)">
    <rect width="340" height="300" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#334155"/>
    <text x="20" y="34" fill="#e0b25c" font-size="12" font-weight="700" letter-spacing="2">ESTÁGIO 2</text>
    <text x="20" y="60" fill="#f5f3ff" font-size="19" font-weight="700">Autorização da sessão</text>
    <rect x="20" y="74" width="150" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="95" y="91" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">exige: preferencial</text>

    <rect x="20" y="112" width="300" height="78" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="34" y="132" fill="#6ee7b7" font-size="12" font-weight="700">① portal e broker</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d1fae5">
      <rect x="34" y="142" width="88" height="34" rx="6" fill="#0b1220"/><text x="78" y="164" text-anchor="middle">enum-ws</text>
      <rect x="128" y="142" width="96" height="34" rx="6" fill="#0b1220"/><text x="176" y="164" text-anchor="middle">broker-daas</text>
      <rect x="230" y="142" width="76" height="34" rx="6" fill="#0b1220"/><text x="268" y="164" text-anchor="middle">cc-daas</text>
    </g>

    <path d="M170 196 V 214" stroke="#fbbf24" stroke-width="2" marker-end="url(#setaA)"/>
    <text x="184" y="210" fill="#fbbf24" font-size="11">se ① não estiver inteiro</text>

    <rect x="20" y="220" width="300" height="66" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="6 4"/>
    <text x="34" y="240" fill="#fbbf24" font-size="12" font-weight="700">② connection lease</text>
    <text x="306" y="240" fill="#94a3b8" font-size="11" text-anchor="end">veredito “alternativo”</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fef3c7">
      <rect x="34" y="250" width="110" height="26" rx="6" fill="#0b1220"/><text x="89" y="268" text-anchor="middle">lease-local</text>
      <rect x="152" y="250" width="96" height="26" rx="6" fill="#0b1220"/><text x="200" y="268" text-anchor="middle">lease-gw</text>
    </g>
  </g>

  <path d="M766 260 H 794" stroke="#6ee7b7" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- ===== estágio 3 ===== -->
  <g transform="translate(800,110)">
    <rect width="360" height="300" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#334155"/>
    <text x="20" y="34" fill="#e0b25c" font-size="12" font-weight="700" letter-spacing="2">ESTÁGIO 3</text>
    <text x="20" y="60" fill="#f5f3ff" font-size="19" font-weight="700">Transporte HDX</text>
    <rect x="20" y="74" width="150" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="95" y="91" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">exige: preferencial</text>

    <rect x="20" y="112" width="320" height="78" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="34" y="132" fill="#6ee7b7" font-size="12" font-weight="700">① EDT sobre UDP 443, nas duas pontas</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d1fae5">
      <rect x="34" y="142" width="140" height="34" rx="6" fill="#0b1220"/><text x="104" y="164" text-anchor="middle">edt-dc</text>
      <rect x="184" y="142" width="140" height="34" rx="6" fill="#0b1220"/><text x="254" y="164" text-anchor="middle">edt-cli</text>
    </g>

    <path d="M180 196 V 214" stroke="#fbbf24" stroke-width="2" marker-end="url(#setaA)"/>
    <text x="194" y="210" fill="#fbbf24" font-size="11">UDP caiu em qualquer ponta</text>

    <rect x="20" y="220" width="320" height="66" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="6 4"/>
    <text x="34" y="240" fill="#fbbf24" font-size="12" font-weight="700">② fallback TCP 443</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fef3c7">
      <rect x="170" y="228" width="76" height="26" rx="6" fill="#0b1220"/><text x="208" y="246" text-anchor="middle">tcp-dc</text>
      <rect x="252" y="228" width="76" height="26" rx="6" fill="#0b1220"/><text x="290" y="246" text-anchor="middle">tcp-cli</text>
    </g>
    <text x="34" y="274" fill="#94a3b8" font-size="11">nenhum grupo inteiro → “interrompe em transporte”</text>
  </g>

  <!-- ===== perfis ===== -->
  <text x="40" y="452" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2">PERFIS DE CICLO DE VIDA</text>
  <rect x="40" y="466" width="1120" height="34" rx="9" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="56" y="488" fill="#ddd6fe" font-size="14" font-weight="700">Sessão nova</text>
  <text x="166" y="488" fill="#c4b5fd" font-size="13">registro → autorização → transporte</text>
  <rect x="800" y="510" width="360" height="34" rx="9" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="816" y="532" fill="#ddd6fe" font-size="14" font-weight="700">Sessão em andamento</text>
  <text x="986" y="532" fill="#c4b5fd" font-size="13">só o transporte</text>
  <text x="40" y="532" fill="#94a3b8" font-size="13">É por isso que o portal pode cair sem derrubar quem já está conectado →</text>

  <g font-size="12" font-weight="700">
    <circle cx="48" cy="570" r="6" fill="#10b981"/><text x="60" y="574" fill="#6ee7b7">ok · todos no ①</text>
    <circle cx="198" cy="570" r="6" fill="#f59e0b"/><text x="210" y="574" fill="#fbbf24">deg · algum no ② ou condição degradando o fluxo em uso</text>
    <circle cx="628" cy="570" r="6" fill="#ef4444"/><text x="640" y="574" fill="#fca5a5">fail · algum estágio sem grupo inteiro</text>
  </g>
</svg>
